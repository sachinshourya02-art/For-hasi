<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hasii ❤️</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e8, #e8d9ff, #d8f3ff);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Clouds */

.cloud {
  position: fixed;
  font-size: 55px;
  opacity: .5;
  animation: cloudMove 15s linear infinite;
  pointer-events: none;
}

.cloud1 {
  top: 10%;
  left: -100px;
}

.cloud2 {
  top: 70%;
  left: -150px;
  animation-delay: 6s;
}

@keyframes cloudMove {
  from {
    transform: translateX(-100px);
  }

  to {
    transform: translateX(120vw);
  }
}

/* Main card */

.card {
  width: 90%;
  max-width: 390px;
  min-height: 500px;
  padding: 30px 22px;
  border-radius: 35px;

  background: rgba(255,255,255,.9);

  box-shadow:
    0 20px 60px rgba(100,60,120,.2);

  text-align: center;

  position: relative;
  z-index: 5;

  backdrop-filter: blur(10px);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  animation: cardIn .7s ease;
}

@keyframes cardIn {

  from {
    opacity: 0;
    transform: scale(.8) translateY(30px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

/* Alien */

.alien {
  font-size: 80px;
  margin-bottom: 15px;

  animation:
    alienFloat 2s ease-in-out infinite;
}

@keyframes alienFloat {

  0%,100% {
    transform: translateY(0) rotate(-3deg);
  }

  50% {
    transform: translateY(-15px) rotate(3deg);
  }
}

/* Text */

h1 {
  color: #ff4f91;
  font-size: 30px;
  margin-bottom: 15px;
}

p {
  color: #555;
  font-size: 16px;
  line-height: 1.7;
  margin: 8px 0;
}

.highlight {
  color: #ff4f91;
  font-weight: bold;
}

/* Buttons */

button {
  border: 0;
  border-radius: 30px;

  padding: 14px 25px;
  margin: 10px 5px;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

.yes {
  background: #ff5b9d;
  color: white;

  box-shadow:
    0 8px 20px rgba(255,91,157,.35);
}

.yes:active {
  transform: scale(.92);
}

.no {
  background: #eeeeee;
  color: #555;
}

/* Cute animation */

.cute-animation {

  margin: 20px 0;

  font-size: 50px;

  height: 70px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;
}

.bounce {
  animation: bounce 1s infinite;
}

.bounce2 {
  animation: bounce 1s infinite .2s;
}

@keyframes bounce {

  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-18px);
  }
}

/* Floating hearts */

.heart {

  position: fixed;

  bottom: -50px;

  pointer-events: none;

  z-index: 1;

  animation:
    heartFloat 5s linear forwards;
}

@keyframes heartFloat {

  0% {

    transform:
      translateY(0)
      scale(.7)
      rotate(0);

    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  100% {

    transform:
      translateY(-110vh)
      scale(1.3)
      rotate(360deg);

    opacity: 0;
  }
}

/* Sparkles */

.sparkle {

  position: fixed;

  pointer-events: none;

  animation:
    sparkleAnim 2s ease-out forwards;
}

@keyframes sparkleAnim {

  from {

    transform: scale(0);

    opacity: 1;
  }

  to {

    transform:
      scale(2)
      translateY(-100px);

    opacity: 0;
  }
}

/* Sad alien */

.sadAlien {

  font-size: 70px;

  animation:
    sad 1.2s infinite;
}

@keyframes sad {

  0%,100% {
    transform: rotate(-5deg);
  }

  50% {
    transform: rotate(5deg);
  }
}

/* Final */

.final {

  font-size: 24px;

  color: #ff4f91;

  font-weight: bold;
}

.small {

  font-size: 13px;

  color: #999;
}

</style>
</head>


<body>

<!-- Moving clouds -->

<div class="cloud cloud1">☁️</div>

<div class="cloud cloud2">☁️</div>


<!-- Main website -->

<div class="card" id="card">

  <div class="alien">👽</div>

  <h1>Hasiiii... 🥺</h1>

  <p>
    Waittt... please don't gooo 😭🤌
  </p>

  <div class="cute-animation">

    <span class="bounce">🥺</span>

    <span class="bounce2">👉</span>

    <span class="bounce">👈</span>

  </div>

  <button
    class="yes"
    onclick="page1()">

    Okayyy... tell me 🥺

  </button>

</div>


<script>

/* =====================================
   FLOATING HEARTS
===================================== */

const hearts = [
  "❤️",
  "💗",
  "💕",
  "💖",
  "💘",
  "💓",
  "🥺",
  "✨"
];


function createHeart() {

  const heart =
    document.createElement("div");

  heart.className = "heart";

  heart.innerHTML =
    hearts[
      Math.floor(
        Math.random() * hearts.length
      )
    ];

  heart.style.left =
    Math.random() * 100 + "vw";

  heart.style.fontSize =
    (18 + Math.random() * 25) + "px";

  heart.style.animationDuration =
    (4 + Math.random() * 3) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {

    heart.remove();

  }, 7000);
}


setInterval(createHeart, 700);


/* =====================================
   SPARKLES
===================================== */

function sparkle() {

  const s =
    document.createElement("div");

  s.className = "sparkle";

  s.innerHTML = "✨";

  s.style.left =
    Math.random() * 100 + "vw";

  s.style.top =
    (30 + Math.random() * 60) + "vh";

  document.body.appendChild(s);

  setTimeout(() => {

    s.remove();

  }, 2000);
}


setInterval(sparkle, 1200);


/* =====================================
   PAGE 1 — SORRY
===================================== */

function page1() {

  const card =
    document.getElementById("card");

  card.innerHTML = `

    <div class="sadAlien">
      👽
    </div>

    <h1>
      I'm Sorryyy 😭
    </h1>

    <p>
      Hasii... I know I hurt youuu.
    </p>

    <p class="highlight">
      And I'm genuinely very sorry. 🥺❤️
    </p>

    <div class="cute-animation">

      <span class="bounce">
        💔
      </span>

      <span>
        ➡️
      </span>

      <span class="bounce2">
        ❤️
      </span>

    </div>

    <p>
      I never wanted to make you feel bad.
      Reallyyy... 😭🤌
    </p>

    <button
      class="yes"
      onclick="page2()">

      I'm listening 🥺

    </button>

  `;
}


/* =====================================
   PAGE 2 — PROMISE
===================================== */

function page2() {

  const card =
    document.getElementById("card");

  card.innerHTML = `

    <div class="cute-animation">

      <span class="bounce">
        👽
      </span>

      <span class="bounce2">
        💐
      </span>

      <span class="bounce">
        🥺
      </span>

    </div>

    <h1>
      I Promiseee 🤌
    </h1>

    <p>
      From now I won't make you feel
      like hurting reallyyy.
    </p>

    <p class="highlight">
      Really... I won't. ❤️
    </p>

    <div class="cute-animation">

      <span class="bounce">
        🤞
      </span>

      <span>
        💗
      </span>

      <span class="bounce2">
        🤞
      </span>

    </div>

    <p>
      I'll try my best to be better.
      Promiseee. 🥺
    </p>

    <button
      class="yes"
      onclick="page3()">

      One last thing... 👉👈

    </button>

  `;
}


/* =====================================
   PAGE 3 — FIRST REQUEST
===================================== */

let noCount = 0;


function page3() {

  noCount = 0;

  const card =
    document.getElementById("card");

  card.innerHTML = `

    <div class="alien">
      👽
    </div>

    <h1>
      Hasiiii... 🥺
    </h1>

    <div class="cute-animation">

      <span class="bounce">
        🙏
      </span>

      <span class="bounce2">
        🥺
      </span>

      <span class="bounce">
        🤌
      </span>

    </div>

    <p class="highlight">
      Plzzzz unblock meee naaa 😭❤️
    </p>

    <p>
      Alien is missing Hasii badlyyy...
    </p>

    <button
      class="yes"
      onclick="forgive()">

      ❤️ UNBLOCK ME

    </button>

    <button
      class="no"
      onclick="noRequest()">

      😤 NO

    </button>

  `;
}


/* =====================================
   NO BUTTON — 3 REQUESTS
===================================== */

function noRequest() {

  noCount++;

  const card =
    document.getElementById("card");


  /* NO #1 */

  if (noCount === 1) {

    card.innerHTML = `

      <div class="sadAlien">
        🥺
      </div>

      <h1>
        Are you sure, Hasii? 😭
      </h1>

      <div class="cute-animation">

        💔 👉👈 💔

      </div>

      <p>
        Please reconsider naaa... 🥺
      </p>

      <p class="highlight">
        Alien is really sorryyy 🤌❤️
      </p>

      <button
        class="yes"
        onclick="forgive()">

        ❤️ Okay, I'll unblock you

      </button>

      <button
        class="no"
        onclick="noRequest()">

        😭 Still NO

      </button>

    `;

  }


  /* NO #2 */

  else if (noCount === 2) {

    card.innerHTML = `

      <div class="sadAlien">
        😭
      </div>

      <h1>
        Reallyyy? 🥺
      </h1>

      <div class="cute-animation">

        👽 💔 🥺

      </div>

      <p>
        Please don't say nooo... 😭
      </p>

      <p>
        Give Alien one more chanceee 🤌❤️
      </p>

      <button
        class="yes"
        onclick="forgive()">

        💗 Okayyy, fine

      </button>

      <button
        class="no"
        onclick="noRequest()">

        😤 NOOO

      </button>

    `;

  }


  /* NO #3 */

  else if (noCount === 3) {

    card.innerHTML = `

      <div class="sadAlien">
        🥹
      </div>

      <h1>
        Okay... last time 🥺
      </h1>

      <div class="cute-animation">

        🙏 💗 🙏

      </div>

      <p class="highlight">
        Please unblock meee naaa 🤌❤️
      </p>

      <p>
        I promise I'll try my best
        to never hurt you again.
      </p>

      <button
        class="yes"
        onclick="forgive()">

        ❤️ YES, I FORGIVE YOU

      </button>

      <button
        class="no"
        onclick="finalNo()">

        😭 NO

      </button>

    `;

  }

}


/* =====================================
   AFTER FINAL NO
===================================== */

function finalNo() {

  const card =
    document.getElementById("card");

  card.innerHTML = `

    <div class="sadAlien">
      🥺
    </div>

    <h1>
      Okayyy... 😭
    </h1>

    <div class="cute-animation">

      👽 💔 🥺

    </div>

    <p>
      I won't force you, Hasii. ❤️
    </p>

    <p>
      I'll give you some space...
    </p>

    <p class="highlight">
      But whenever you're ready,
      Alien is still here. 👽❤️
    </p>

    <div class="cute-animation">

      🥺 👉👈 💗

    </div>

    <p class="small">
      Take care, Hasii ❤️
    </p>

  `;

}


/* =====================================
   YES — FORGIVEN
===================================== */

function forgive() {

  const card =
    document.getElementById("card");

  card.innerHTML = `

    <div class="alien">
      👽❤️
    </div>

    <h1>
      YAYYYYY!!! 🎉
    </h1>

    <div class="cute-animation">

      <span class="bounce">
        🎉
      </span>

      <span class="bounce2">
        💗
      </span>

      <span class="bounce">
        🎉
      </span>

    </div>

    <p class="final">
      Hasii forgave Alien 🥹❤️
    </p>

    <p>
      Thank youuu so muchhh 😭🤌
    </p>

    <p>
      I promise I'll be better
      and won't hurt you again. ❤️
    </p>

    <div class="cute-animation">

      👽 💗 🥺 💗 👽

    </div>

    <p class="small">
      Made with 100% sorryyy
      and 200% love 🥺
    </p>

  `;


  /* Heart explosion */

  for (
    let i = 0;
    i < 60;
    i++
  ) {

    setTimeout(
      createHeart,
      i * 60
    );

  }

}

</script>

</body>
</html>
